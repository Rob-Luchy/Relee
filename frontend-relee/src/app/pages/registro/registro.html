<div class="container login-container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 login-card-column">
      <div class="card login-card shadow-lg p-4">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Registro de Usuario</h2>

          <!-- ✅ Formulario Reactivo -->
<form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label for="name" class="form-label">Nombre Completo</label>
    <input type="text" id="name" class="form-control"
           formControlName="nombre_completo"
           placeholder="Escribe tu nombre" required>
  </div>

  <div class="mb-3">
    <label for="regEmail" class="form-label">Correo Electrónico</label>
    <input type="email" id="regEmail" class="form-control"
           formControlName="email"
           placeholder="tu@ejemplo.com" required>
  </div>

  <div class="mb-3">
    <label for="regPassword" class="form-label">Contraseña</label>
    <input type="password" id="regPassword" class="form-control"
           formControlName="password"
           placeholder="Mínimo 8 caracteres" required>
  </div>

  <div class="mb-3">
    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
    <input type="password" id="confirmPassword" class="form-control"
           formControlName="confirmar_password"
           placeholder="Repite la contraseña" required>
  </div>

  <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-3">
    Crear Cuenta
  </button>

  <div class="text-center mt-3">
    <span class="text-success" *ngIf="mensaje">{{ mensaje }}</span>
  </div>
</form>
        </div>
      </div>

      <p class="text-center mt-3 mb-0">
        ¿Ya tienes una cuenta?
        <a href="/login" class="text-decoration-none fw-bold">Iniciar Sesión</a>
      </p>
    </div>
  </div>
</div>
